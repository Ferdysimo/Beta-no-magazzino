services:
  mongo:
    image: mongo:8.0
    container_name: pastasciutta-local-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-local-data:/data/db

  backend:
    build:
      context: .
      dockerfile: docker/local/backend.Dockerfile
    container_name: pastasciutta-local-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: pastasciutta_local
      JWT_SECRET: local-dev-only-change-in-production-0123456789abcdef
      PYTHONUNBUFFERED: "1"
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8001"
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: docker/local/frontend.Dockerfile
    container_name: pastasciutta-local-frontend
    restart: unless-stopped
    environment:
      REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8001}
      HOST: 0.0.0.0
      PORT: "3000"
      BROWSER: none
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    depends_on:
      - backend

volumes:
  mongo-local-data:
  frontend-node-modules:
